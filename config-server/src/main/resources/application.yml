spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/likhithasureshh/eCommerce-config-server
          username: likhithasureshh
          password: ${GITHUB_PAT}
          default-label: main
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: true
  lease-renewal-interval-in-seconds: 10
  lease-expiration-duration-in-seconds: 30

server:
  port: 8888

